<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
        <link rel="stylesheet" href="./styles.css" />
        <title>Exposición en AR</title>
    </head>
    <body>
        <section id="on-boarding">
            <div class="intro-header">
                <h1>Bienvenido a esta exposición en Realidad Aumentada</h1>
                <p>
                    A continuación, podrás explorar la sala e interactuar con
                    las obras. Sólo deberás aceptar la solicitud de permiso para
                    acceder a la cámara, apuntar tu celular a las obras y
                    disfrutar de la exposición.
                </p>
                <p>Haz click en continuar para iniciar</p>
                <button id="start-button">Continuar</button>
            </div>
        </section>
        <a-scene
            mindar-image="imageTargetSrc: ./targets/targets.mind;
                filterMinCF: 0.0001;
                filterBeta: 0.001;"
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false"
            id="ar-scene"
        >
            <!-- Cargar assets (videos) -->
            <a-assets>
                <video
                    id="video1"
                    src="./Assets/Ayo Angaipoa.mp4"
                    loop
                    muted
                    playsinline
                    webkit-playsinline
                    crossorigin="anonymous"
                ></video>
                <img
                    id="image1"
                    src="./Assets/Yo no me paro en peligro, Alexandra Idrobo.jpg"
                    crossorigin="anonymous"
                    alt="Alexandra Idrobo, Yo no me paro en peligro, 2025. Serie fotográfica impresa sobre tela antifluidos. 67 por 105 centímetros. Colección del artista."
                />
                <audio
                    id="audio1"
                    src="./Assets/Poema de Hugo Idrobo.mp3"
                    loop
                    muted
                    playsinline
                    webkit-playsinline
                    crossorigin="anonymous"
                ></audio>
                <img
                    id="image2"
                    src="./Assets/Peinilla, Alexandra Idrobo.jpg"
                    crossorigin="anonymous"
                    alt="Alexandra Idrobo, Peinilla, 2023. Ilustración digital impresa en tela. 101 por 102 centímetros. Colección del artista."
                />
                <audio
                    id="audio2"
                    src="./Assets/Cimarrón.mp3"
                    loop
                    muted
                    playsinline
                    webkit-playsinline
                    crossorigin="anonymous"
                ></audio>
                <img
                    id="image3"
                    src="./Assets/Camino hacia un lugar de imprecisiones  - Laura Campaz.jpg"
                    crossorigin="anonymous"
                    alt='Laura Campaz Camino hacia un lugar de imprecisiones 2De la serie "Raices que nos unen" 2022 Impresión en papel retablado 18 imágenes 40 por 40 centímetros. Colección del artista'
                />
                <audio
                    id="audio3"
                    src="./Assets/Yemaya, Historia , Rezo y Canto , .mp3"
                    loop
                    muted
                    playsinline
                    webkit-playsinline
                    crossorigin="anonymous"
                ></audio>
                <video
                    id="video2"
                    src="./Assets/Caigi Ayo.mp4"
                    loop
                    muted
                    playsinline
                    webkit-playsinline
                    crossorigin="anonymous"
                ></video>
                <img
                    id="image4"
                    src="./Assets/Ruta 1 Laura Campaz.jpg"
                    crossorigin="anonymous"
                    alt="Laura Campaz, Ruta 1, 2016 a 2022. Serie Migraciones. Fotografía digital. 72 por 52 centímetros. Colección del artista."
                />
                <audio
                    id="audio4"
                    src="./Assets/Prietitud.mp3"
                    loop
                    muted
                    playsinline
                    webkit-playsinline
                    crossorigin="anonymous"
                ></audio>
                <img
                    id="image5"
                    src="./Assets/Ruta 2 Laura Campaz.jpg"
                    crossorigin="anonymous"
                    alt="Laura Campaz, Ruta 2, 2016 a 2022. Serie Migraciones. Fotografía digital. 72 por 52 centímetros. Colección del artista."
                />
                <audio
                    id="audio5"
                    src="./Assets/Quién Los Mató.mp3"
                    loop
                    muted
                    playsinline
                    webkit-playsinline
                    crossorigin="anonymous"
                ></audio>
                <img
                    id="image6"
                    src="./Assets/Me escapé de la oscuridad Laura Campaz.jpg"
                    crossorigin="anonymous"
                    alt="⁠Laura Campaz ,Me escapé a la oscuridad, 2022. Bordado en tela. 60 por 60 centimetros. Colección del artista. 8 cuadros. Poema: Soy invisible. No, no soy de aquellos trasgos que atormentaban a Edgar Alan Poe, ni tampoco uno de esos ectoplasmas de las películas de Hollywood. Soy real, de carne y hueso, con músculos y humores, e incluso cabe afirmar que poseo una mente. Sabed que si soy invisible ello se debe, tan sólo, a que la gente se niega a verme. Soy como las cabezas separadas del tronco que a veces veis en las barracas de feria, soy como un reflejo de crueles espejos con duros cristales deformantes. Cuantos se acercan a mí únicamente ven lo que me rodea, o inventos de su imaginación. Lo ven todo, cualquier cosa, menos mi persona. Mi invisibilidad tampoco se debe a una alteración bioquímica de mi piel. La invisibilidad a que me refiero halla su razón de ser en el especial modo de mirar de aquellxs con quienes trato. Es el resultado de su mirada mental, de esa mirada con la que ven la realidad, mediante el auxilio de los ojos. No me quejo, ni tampoco protesto. A veces es una ventaja pasar sin ser vistx, aunque por lo general ataca los nervios. Quienes padecen aquel defecto  visual  están  tropezando  constantemente conmigo. Y también ocurre que unx duda muy a menudo de su propia existencia. Unx se pregunta si, en realidad, no es más que un fantasma en la mente del prójimo, algo así como una imagen de pesadilla que el durmiente procura, con todas sus fuerzas, desvanecer. Cuando  unx siente eso, comienza  a  devolver, impulsadx por el resentimiento, los empujones que la gente le propina. Y séame permitido confesar que ésta es una actitud casi constante. Unx experimenta la dolorosa necesidad de convencerse a sí mismx de que existe, de veras, en el mundo real; de que unx participa en el eco y la angustia de todxs, y unx crispa los puños, ataca, maldice y blasfema  para  obligar  a  lxs  demás  a que reconozcan su existencia. Sin embargo, rara vez lo logra. Escrito por Ralph Ellison."
                />
                <img
                    id="image7"
                    src="./Assets/Raices que nos unen  Laura Camopaz.jpg"
                    crossorigin="anonymous"
                    alt="Laura CampazRaíces que nos unen. De la serie 'Recordar y nunca olvidar' 2021 Collage digital  impreso en tela 152 por 264 centímetros. Colección del artista. Poema: Trinidad trenzaba una trenza, Trenza que no se destrenza, De tanto trenzar la trenza, Queda trinidad hecha trenza. Escrito por una anónima."
                />
            </a-assets>

            <!-- AR Camera -->
            <a-camera
                position="0 0 0"
                look-controls="enabled: false"
            ></a-camera>

            <!-- Markers setup -->
            <a-entity mindar-image-target="targetIndex: 0" id="marker1">
                <a-video
                    id="videoElement1"
                    src="#video1"
                    position="0 0 0"
                    width="1.78"
                    height="1"
                ></a-video>
            </a-entity>
            <a-entity mindar-image-target="targetIndex: 4" id="marker2">
                <a-image
                    id="imageElement1"
                    src="#image1"
                    position="0 0 0"
                    width="1"
                    height="1.5"
                ></a-image>
                <a-sound
                    id="audioElement1"
                    src="#audio1"
                    autoplay="false"
                    loop="true"
                ></a-sound>
            </a-entity>
            <a-entity mindar-image-target="targetIndex: 2" id="marker3">
                <a-image
                    id="imageElement2"
                    src="#image2"
                    position="0 0 0"
                    width="1"
                    height="1"
                ></a-image>
                <a-sound
                    id="audioElement2"
                    src="#audio2"
                    autoplay="false"
                    loop="true"
                ></a-sound>
            </a-entity>
            <a-entity mindar-image-target="targetIndex: 8" id="marker4">
                <a-image
                    id="imageElement3"
                    src="#image3"
                    position="0 0 0"
                    width="1"
                    height="1"
                ></a-image>
                <a-sound
                    id="audioElement3"
                    src="#audio3"
                    autoplay="false"
                    loop="true"
                ></a-sound>
            </a-entity>
            <a-entity mindar-image-target="targetIndex: 1" id="marker5">
                <a-video
                    id="videoElement2"
                    src="#video2"
                    position="0 0 0"
                    width="1.78"
                    height="1"
                >
                </a-video>
            </a-entity>
            <a-entity mindar-image-target="targetIndex: 5" id="marker6">
                <a-image
                    id="imageElement4"
                    src="#image4"
                    position="0 0 0"
                    width="1.6"
                    height="2"
                ></a-image>
                <a-sound
                    id="audioElement4"
                    src="#audio4"
                    autoplay="false"
                    loop="true"
                ></a-sound>
            </a-entity>
            <a-entity mindar-image-target="targetIndex: 6" id="marker7">
                <a-image
                    id="imageElement5"
                    src="#image5"
                    position="0 0 0"
                    width="1.6"
                    height="2"
                ></a-image>
                <a-sound
                    id="audioElement5"
                    src="#audio5"
                    autoplay="false"
                    loop="true"
                ></a-sound>
            </a-entity>
            <a-entity mindar-image-target="targetIndex: 3" id="marker8">
                <a-image
                    id="imageElement6"
                    src="#image6"
                    position="0 0 0"
                    width="1.344"
                    height="2"
                ></a-image>
            </a-entity>
            <a-entity mindar-image-target="targetIndex: 7" id="marker9">
                <a-image
                    id="imageElement7"
                    src="#image7"
                    position="0 0 0"
                    width="2"
                    height="2.170"
                ></a-image>
            </a-entity>
        </a-scene>
    </body>
    <footer>
        <script>
            console.log("🔹 DOM fully loaded and parsed");
            const startButton = document.getElementById("start-button");
            const onBoardingSection = document.getElementById("on-boarding");

            const videos = document.querySelectorAll("video");

            startButton.addEventListener("click", function () {
                console.log(
                    "🔹 Start button clicked, requesting camera access...",
                );
                // Hide the onboarding section and start the AR experience
                onBoardingSection.style.display = "none";
                console.log(
                    "🔹 Onboarding section hidden, starting AR experience...",
                );
            });

            // Setup video events for each marker and video
            const setupVideoEvents = (markerId, videoId) => {
                const video = document.getElementById(videoId);
                const marker = document.getElementById(markerId);

                marker.addEventListener("targetFound", () => {
                    console.log(
                        `🔹 Marcador ${markerId} detectado, reproduciendo ${videoId}...`,
                    );
                    video.muted = false; // Unmute the video when the marker is found
                    video
                        .play()
                        .catch((error) =>
                            console.log(
                                `⚠️ Error al reproducir ${videoId}:`,
                                error,
                            ),
                        );
                });

                marker.addEventListener("targetLost", () => {
                    console.log(
                        `🔹 Marcador ${markerId} perdido, pausando ${videoId}...`,
                    );
                    video.pause();
                });
            };

            // Setup video events for each marker and video
            setupVideoEvents("marker1", "video1");
            setupVideoEvents("marker5", "video2");

            // =================================================================================================

            // Setup image and audio events
            const setupAudioEvents = (markerId, audioId) => {
                const audio = document.getElementById(audioId);
                const marker = document.getElementById(markerId);

                marker.addEventListener("targetFound", () => {
                    console.log(
                        `🔹 Marcador ${markerId} detectado, reproduciendo ${audioId}...`,
                    );
                    audio.currentTime = 0; // optional: restart each time it's found
                    audio.muted = false; // Unmute the audio when the marker is found
                    audio
                        .play()
                        .catch((error) =>
                            console.log(
                                `⚠️ Error al reproducir ${audioId}:`,
                                error,
                            ),
                        );
                });

                marker.addEventListener("targetLost", () => {
                    console.log(
                        `🔹 Marcador ${markerId} perdido, pausando ${audioId}...`,
                    );
                    audio.pause();
                });
            };
            setupAudioEvents("marker2", "audio1");
            setupAudioEvents("marker3", "audio2");
            setupAudioEvents("marker4", "audio3");
            setupAudioEvents("marker6", "audio4");
            setupAudioEvents("marker7", "audio5");
        </script>
    </footer>
</html>
